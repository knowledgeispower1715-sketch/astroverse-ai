<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c16" />
      <stop offset="100%" stop-color="#1c1335" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5d061" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0b0c16" stop-opacity="0" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="0" y="0" width="300" height="480" rx="16" fill="url(#bgGrad)" stroke="#d4af37" stroke-width="2" />
  
  <!-- Outer Ornate Frame -->
  <rect x="10" y="10" width="280" height="460" rx="12" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.4" />
  <rect x="16" y="16" width="268" height="448" rx="8" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.8" />

  <!-- Corner Flourishes -->
  <path d="M 22 34 L 34 22 M 22 22 L 34 34" stroke="#f5d061" stroke-width="1.5" stroke-opacity="0.8" />
  <path d="M 278 34 L 266 22 M 278 22 L 266 34" stroke="#f5d061" stroke-width="1.5" stroke-opacity="0.8" />
  <path d="M 22 446 L 34 458 M 22 458 L 34 446" stroke="#f5d061" stroke-width="1.5" stroke-opacity="0.8" />
  <path d="M 278 446 L 266 458 M 278 458 L 266 446" stroke="#f5d061" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Card Header / Number -->
  <text x="150" y="42" fill="#f5d061" font-family="Cinzel, serif" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle">
    XVII
  </text>

  <!-- Inner Artwork Canvas -->
  <rect x="26" y="56" width="248" height="348" rx="6" fill="#06070d" stroke="#d4af37" stroke-width="1" stroke-opacity="0.5" />
  <circle cx="150" cy="230" r="110" fill="url(#glowGrad)" />

  <!-- Sacred Geometry / Astrological Ring -->
  <circle cx="150" cy="230" r="95" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />
  <circle cx="150" cy="230" r="75" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.6" />
  <polygon points="150,158 212,266 88,266" fill="none" stroke="#f5d061" stroke-width="1" stroke-opacity="0.4" />
  <polygon points="150,302 212,194 88,194" fill="none" stroke="#f5d061" stroke-width="1" stroke-opacity="0.4" />

  <!-- Central Symbolism Iconography -->
  <text x="150" y="245" fill="#f5d061" font-family="serif" font-size="46" text-anchor="middle" filter="url(#goldGlow)">
    ✦
  </text>

  <!-- Astrological / Elemental Annotation -->
  <text x="150" y="386" fill="#f5d061" font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="2" text-anchor="middle" fill-opacity="0.7">
    AQUARIUS
  </text>

  <!-- Card Name Footer -->
  <rect x="36" y="416" width="228" height="34" rx="6" fill="#0c0d16" stroke="#d4af37" stroke-width="1" />
  <text x="150" y="438" fill="#f5d061" font-family="Cinzel, serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">
    THE STAR
  </text>
</svg>